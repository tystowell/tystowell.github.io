# Categories drive the index, filters, colors and "jump to" navigation.
# `id` is what you put in a project's `category:` front matter.
# `group` clusters categories into top-level sections, in the order listed here.
# `hue` is the accent color used for chips, thumbnails and highlights.
# Within a category, projects are always sorted by date, newest first.

