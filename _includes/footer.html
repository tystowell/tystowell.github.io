<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <p class="footer-name">{{ site.author.name }}</p>
      <p class="muted">{{ site.author.affiliation }}</p>
    </div>
    {% include social-links.html %}
  </div>
  <div class="container footer-meta mono">
    <span>© {{ site.time | date: "%Y" }} · Built with Jekyll &amp; GitHub Pages</span>
    {%- comment -%} Easter egg: /decohere/ doesn't exist, so this opens the 404 page. {%- endcomment %}
    <a class="decohere-btn" href="{{ '/decohere/' | relative_url }}" title="Measure the page and see what happens">decohere</a>
  </div>
</footer>
