---
layout: default
---
<article class="container page">
  <header class="page-header{% if page.photo %} page-header-photo{% endif %}">
    <div>
      {% if page.eyebrow %}<p class="eyebrow mono">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    </div>
    {% if page.photo %}<img class="page-photo" src="{{ page.photo | relative_url }}" alt="{{ page.photo_alt | default: site.author.name }}">{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
