# ─────────────────────────────────────────────────────────────
#  Site settings — edit these first
# ─────────────────────────────────────────────────────────────
title: Tyler Stowell
tagline: Quantum information science · quantum networks · simulation & experiment
description: >-
  Portfolio of research and projects in quantum information science —
  color-center quantum memories, quantum frequency conversion, and more.

author:
  name: Tyler Stowell
  affiliation: Brigham Young University
  email: trs66@byu.edu
  github: tystowell
  scholar: ""        # Google Scholar profile URL (leave empty to hide)
  linkedin: ""       # LinkedIn profile URL (leave empty to hide)
  orcid: ""          # ORCID URL (leave empty to hide)
  cv: ""             # e.g. /assets/files/cv.pdf — leave empty to hide the CV button

# Full-height photo on the home page. Delete this block to show only the animated Bloch sphere instead.
# `bloch: true` floats the animated Bloch sphere over the photo's fade.
hero_photo:
  bloch: true
  src: /assets/img/tyler-portrait.jpg
  alt: Tyler aligning a fiber to the integrated homodyne QRNG under a microscope
  caption: Aligning the integrated homodyne QRNG
  link: /work/homodyne-qrng/

# Short intro on the home page (Markdown allowed)
intro: >-
  I work on the hardware and theory behind quantum networks: simulators for
  cavity-coupled color-center memories, photonic chips for quantum key
  distribution and random number generation, and quantum frequency conversion
  in the lab. I'm applying to PhD programs to keep building them.

# ─────────────────────────────────────────────────────────────
#  URL settings
#  This repo is served at https://tystowell.github.io/TechnicalPortfolio
#  If you rename the repo to "tystowell.github.io", set baseurl to "".
# ─────────────────────────────────────────────────────────────
url: https://tystowell.github.io
baseurl: ""

# ─────────────────────────────────────────────────────────────
#  Content
# ─────────────────────────────────────────────────────────────
collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values:
      layout: page
      image: /assets/img/tyler-portrait.jpg   # preview image when a link to the site is shared

markdown: kramdown
kramdown:
  math_engine: null   # MathJax renders $...$ / $$...$$ client-side (see _includes/head.html)

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _templates
  - vendor
